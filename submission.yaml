submission:
  title: "MedBrief AI"

  problem_statement: >
    Clinicians preparing ward-round notes, specialist referrals, and discharge
    documentation must review large volumes of records spanning multiple departments
    and time periods. Critical events such as medication changes, outstanding
    investigations, open referrals, and unresolved follow-ups are easily missed
    during transitions of care, creating patient safety risks. Existing tools
    do not provide structured, evidence-linked handover tracking or a reliable
    way to confirm which items have been reviewed before care is transferred.

  solution_summary: >
    MedBrief AI extracts structured clinical data from uploaded PDF and plain-text
    documents, builds a longitudinal patient timeline, and generates four types of
    evidence-linked clinical briefs (Ward Round, Referral, Discharge/Handoff,
    Discharge Summary). The Handover Guard feature provides a patient-specific
    review workspace that surfaces unresolved investigations, open referrals,
    pending follow-ups, medication changes, and documentation conflicts with a
    three-state review workflow and full persistence. Optional IBM watsonx.ai
    integration enables LLM-enhanced Ask and Brief generation with Granite models,
    automatic deterministic fallback, and explicit AI transparency indicators.

  key_features:
    - "Handover Guard: patient-specific review workspace with evidence linking, three-state review workflow (Incomplete/Ready/Reviewed), and persistence (SQLite live, localStorage demo)"
    - "Multi-document longitudinal analysis: ChangeMap, CareLoop tracking, medication reconciliation, and documentation conflict detection across uploaded clinical documents"
    - "Evidence-linked clinical brief generation for four types: Ward Round, Referral, Discharge/Handoff, and Discharge Summary with numbered evidence index"
    - "IBM watsonx.ai integration (Granite models) for Ask AI and Brief generation with automatic deterministic fallback and explicit AI transparency indicators"
    - "Demo mode: full clinical engine in-browser without authentication, database, or AI credentials (localStorage persistence, deterministic engine)"

  tech_stack:
    languages: ["TypeScript", "JavaScript"]
    frameworks: ["React 18", "Vite 5", "Express 4.18", "Tailwind CSS 3.4", "Zustand 4.5", "Prisma 5.10"]
    ibm_technologies: ["IBM watsonx.ai (optional, Granite models)", "IBM IAM token authentication"]
    databases: ["SQLite (via Prisma)"]
    other: ["Node.js 20+", "Vitest", "pdf-parse", "Multer", "jsonwebtoken", "Zod", "Lucide React"]

  what_we_are_most_proud_of: >
    The Handover Guard is our strongest innovation. It directly addresses a
    documented patient safety gap by providing structured, evidence-linked review
    tracking that persists across sessions. Every item is linked to its source
    document, page, and excerpt. The three-state review workflow creates a clear
    accountability trail. Combined with the deterministic shared clinical engine
    (171 tests passing) and IBM watsonx.ai transparency indicators, MedBrief AI
    delivers reliable, auditable clinical decision support.

  known_limitations: >
    Clinical extraction uses heuristic/regex patterns, not a validated clinical NLP
    pipeline. PDF text extraction only; scanned PDFs require OCR (not implemented).
    Medication reconciliation uses exact name matching, no fuzzy mapping. IBM
    watsonx.ai REST integration is implemented; IBM Bob IDE MCP integration is
    documented as a planned extension (see docs/ibm-bob-integration.md). No
    production deployment; single-user scope; no multi-tenancy.

